# cross 0.2.5 unconditionally bind-mounts the host `target/` directory into the
# container (see src/docker/local.rs), so build artifacts appear under
# `target/<triple>/release/` on the host and can be uploaded by the workflow.
#
# cross 0.2.5's release image (`:0.2.5`) is based on an old glibc (Debian
# buster), which cannot run current Rust host toolchains. Pin a newer
# main-branch image (Ubuntu 24.04 base) by digest so the toolchain cannot
# change silently. Refresh with:
#   docker buildx imagetools inspect ghcr.io/cross-rs/aarch64-unknown-linux-musl:main
[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl@sha256:10769140e3ce9c01cb2b1d4751ce3afb31fb2edea5afcd409ccde589729d7910"
pre-build = [
    "apt-get update",
    "apt-get install --assume-yes ninja-build meson nasm",
]
