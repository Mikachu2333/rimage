name: rimage

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - "LICENSE**"
  pull_request:
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - "LICENSE**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            target-apt-arch: amd64
            cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            target-apt-arch: amd64
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            target-apt-arch: arm64
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            target-apt-arch: arm64
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            cross: false
          - target: i686-pc-windows-msvc
            os: windows-2025
            cross: false
          - target: x86_64-apple-darwin
            os: macos-15-intel
            cross: false
          - target: aarch64-apple-darwin
            os: macos-15
            cross: false

    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up Ubuntu multiarch
        if: startsWith(matrix.os, 'ubuntu') && !matrix.cross && matrix.target-apt-arch != 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          readonly DISTRO_CODENAME=$(lsb_release -cs)
          readonly HOST_ARCH=$(dpkg-architecture -q DEB_HOST_ARCH)
          readonly TARGET_ARCH="${{ matrix.target-apt-arch }}"
          sudo dpkg --add-architecture "$TARGET_ARCH"
          sudo rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list
          sudo tee /etc/apt/sources.list <<EOF
          deb [arch=$HOST_ARCH] http://azure.archive.ubuntu.com/ubuntu/ $DISTRO_CODENAME main restricted universe multiverse
          deb [arch=$HOST_ARCH] http://azure.archive.ubuntu.com/ubuntu/ $DISTRO_CODENAME-updates main restricted universe multiverse
          deb [arch=$HOST_ARCH] http://azure.archive.ubuntu.com/ubuntu/ $DISTRO_CODENAME-backports main restricted universe multiverse
          deb [arch=$HOST_ARCH] http://security.ubuntu.com/ubuntu/ $DISTRO_CODENAME-security main restricted universe multiverse
          deb [arch=$TARGET_ARCH] http://ports.ubuntu.com/ubuntu-ports/ $DISTRO_CODENAME main universe multiverse
          deb [arch=$TARGET_ARCH] http://ports.ubuntu.com/ubuntu-ports/ $DISTRO_CODENAME-updates main universe multiverse
          deb [arch=$TARGET_ARCH] http://ports.ubuntu.com/ubuntu-ports/ $DISTRO_CODENAME-backports main universe multiverse
          deb [arch=$TARGET_ARCH] http://ports.ubuntu.com/ubuntu-ports/ $DISTRO_CODENAME-security main universe multiverse
          EOF

      - name: install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu') && !matrix.cross
        shell: bash
        run: |
          set -euo pipefail
          packages=(ninja-build meson nasm)
          if [[ "${{ matrix.target }}" == *-musl ]]; then
            packages+=(musl-tools "musl-dev:${{ matrix.target-apt-arch }}")
          fi
          if [[ "${{ matrix.target }}" == aarch64-unknown-linux-* ]]; then
            packages+=(qemu-user gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6:arm64)
          fi
          sudo apt-get -yq update
          sudo apt-get -yq install --fix-missing "${packages[@]}"

      - name: configure x86_64 musl C++ compiler
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: sudo ln -sf /bin/g++ /bin/musl-g++

      - name: install macOS dependencies
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          brew install ninja meson || brew upgrade ninja meson

          # NASM 3.0+ dropped multipass (-Ox) from -hf output, which breaks
          # libaom's CMake detection. Remove this pin after libavif-rs updates.
          # REF: https://github.com/njaard/libavif-rs/issues/122
          brew uninstall -f nasm || true
          brew cleanup nasm || true
          rm -rf /opt/homebrew/bin/nasm /usr/local/bin/nasm /opt/homebrew/opt/nasm
          curl --fail --show-error --silent --location \
            --output /tmp/nasm-macosx.zip \
            https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -o /tmp/nasm-macosx.zip -d /tmp
          sudo install -m 0755 /tmp/nasm-2.16.03/nasm /usr/local/bin/nasm
          sudo mkdir -p /opt/homebrew/bin
          sudo install -m 0755 /tmp/nasm-2.16.03/nasm /opt/homebrew/bin/nasm
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "ASM_NASM=/opt/homebrew/bin/nasm" >> "$GITHUB_ENV"
          /usr/local/bin/nasm -version

      - name: install Windows dependencies
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: choco install -y ninja meson nasm

      - name: install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          target: ${{ matrix.target }}

      - name: install cargo-nextest
        if: ${{ !matrix.cross }}
        uses: taiki-e/install-action@nextest

      - name: install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      - name: build release binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --all-features --target "${{ matrix.target }}"
          else
            cargo build --release --all-features
          fi

      - name: run tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross test --release --all-features --target "${{ matrix.target }}" -- --test-threads=1
            cross test --release --all-features --target "${{ matrix.target }}" --doc
          else
            cargo nextest run --release --all-features
            cargo test --doc --release --all-features
          fi

      - name: upload CLI binary
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: rimage-${{ matrix.target }}
          path: |
            target/${{ env.CARGO_BUILD_TARGET }}/release/rimage
            target/${{ env.CARGO_BUILD_TARGET }}/release/rimage.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          components: rustfmt, clippy

      - name: formatting check
        run: cargo fmt --all -- --check

      - name: install native dependencies
        run: |
          sudo apt-get -yq update
          sudo apt-get -yq install --fix-missing ninja-build meson nasm

      - name: Clippy check
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Keep the complete WASM configuration in one disabled job. Remove the
  # job-level `if` when the Emscripten build is ready to be enabled again.
  wasm:
    name: wasm32-unknown-emscripten (disabled)
    if: ${{ false }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_BUILD_TARGET: wasm32-unknown-emscripten
      CC: emcc
      CXX: em++

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          target: wasm32-unknown-emscripten

      - name: install Emscripten
        run: brew install emscripten

      - name: check WASM target
        shell: bash
        run: |
          set -euo pipefail
          export EMSCRIPTEN_CMAKE_FILE="$(brew --cellar emscripten)/$(brew list --versions emscripten | tr ' ' '\n' | tail -1)/libexec/cmake/Modules/Platform/Emscripten.cmake"
          cargo check --all-features
